<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-label="Три вопроса для проверки ответа"><title>Три вопроса для проверки ответа</title><rect x="15" y="15" width="970" height="72" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><circle cx="58" cy="51.0" r="22" fill="#6F61E8"/><text x="58" y="60.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="100" y="60.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#17171C" text-anchor="start">Ответ про ваше животное?</text><rect x="15" y="99" width="970" height="72" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><circle cx="58" cy="135.0" r="22" fill="#6F61E8"/><text x="58" y="144.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="100" y="144.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#17171C" text-anchor="start">Ровно три предложения?</text><rect x="15" y="183" width="970" height="72" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><circle cx="58" cy="219.0" r="22" fill="#0FBF6E"/><text x="58" y="228.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17171C" text-anchor="middle">3</text><text x="100" y="228.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#17171C" text-anchor="start">Всё понятно? Если нет, это можно уточнить.</text></svg>