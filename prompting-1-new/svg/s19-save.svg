<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="В Алисе нажать значок копирования, показать текст взрослому и вставить в чат урока"><title>В Алисе нажать значок копирования, показать текст взрослому и вставить в чат урока</title><rect x="15" y="15" width="290" height="220" rx="18" fill="#EFEFF2" stroke="#EFEFF2" stroke-width="3"/><circle cx="50" cy="50" r="19" fill="#17171C"/><text x="50" y="58" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="80" y="50" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="start">В Алисе нажмите</text><text x="80" y="76" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="start">значок</text><g transform="translate(70 0)"><rect x="48" y="104" width="44" height="50" rx="8" fill="#FFFFFF" stroke="#5F5F6B" stroke-width="4"/><rect x="64" y="90" width="44" height="50" rx="8" fill="#FFFFFF" stroke="#5F5F6B" stroke-width="4"/></g><text x="160" y="190" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#5F5F6B" text-anchor="middle">Значок из двух квадратов</text><text x="160" y="214" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#5F5F6B" text-anchor="middle">у последнего ответа</text><line x1="315" y1="125" x2="368" y2="125" stroke="#8F8F98" stroke-width="4" stroke-linecap="round"/><path d="M368 125 L354.8 132.2 L354.8 117.8 Z" fill="#8F8F98"/><rect x="378" y="15" width="290" height="220" rx="18" fill="#EFEFF2" stroke="#EFEFF2" stroke-width="3"/><circle cx="413" cy="50" r="19" fill="#17171C"/><text x="413" y="58" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="