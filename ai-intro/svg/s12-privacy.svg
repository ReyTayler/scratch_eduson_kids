<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" role="img" aria-label="Что можно писать в чат и что оставляем при себе"><title>Что можно писать в чат и что оставляем при себе</title><rect x="15" y="15" width="970" height="92" rx="16" fill="#F0EEFE" stroke="#6F61E8" stroke-width="3"/><text x="40" y="52" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#17171C" text-anchor="start">Этого достаточно для ответа</text><text x="40" y="88" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">«Расскажи про кошку. Напиши три предложения».</text><rect x="15" y="122" width="475" height="175" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><text x="39" y="165" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#17171C" text-anchor="start">Можно писать</text><text x="39" y="208" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#17171C" text-anchor="start">Вопросы, просьбы, выдуманные</text><text x="39" y="239" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#17171C" text-anchor="start">имена и истории.</text><rect x="510" y="122" width="475" height="175" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><text x="534" y="165" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#17171C" text-anchor="start">Оставляем при себе</text><text x="534" y="208" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#17171C" text-anchor="start">Телефон, адрес, пароль, сведения</text><text x="534" y="239" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#17171C" text-anchor="start">о школе и семье.</text></svg>