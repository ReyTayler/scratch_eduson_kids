<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="На короткий промт близкий рисует любого зверя, на подробный рисует ежа с зонтом под дождём"><title>На короткий промт близкий рисует любого зверя, на подробный рисует ежа с зонтом под дождём</title><rect x="15" y="15" width="475" height="320" rx="18" fill="#FFFFFF" stroke="#E3E3EA" stroke-width="3"/><text x="252" y="58" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17171C" text-anchor="middle">Промт 1: «Нарисуй зверя.»</text><ellipse cx="252" cy="185" rx="80" ry="48" fill="#F0EEFE" stroke="#6F61E8" stroke-width="5"/><path d="M172 185 L120 150 L120 220 Z" fill="#F0EEFE" stroke="#6F61E8" stroke-width="5" stroke-linejoin="round"/><circle cx="295" cy="172" r="7" fill="#17171C"/><text x="252" y="295" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#5F5F6B" text-anchor="middle">Близкий выбирает сам: вот рыба</text><rect x="510" y="15" width="475" height="320" rx="18" fill="#E7FDF2" stroke="#0FBF6E" stroke-width="3"/><text x="747" y="50.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">Промт 2: «Нарисуй ежа с зонтом</text><text x="747" y="78.6" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">под дождём. На весь лист.»</text><path d="M665 240 q5 -70 70 -72 q55 2 72 72 Z" fill="#17171C"/><line x1="680" y1="198" x2="674" y2="180" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><line x1="694" y1="191" x2="688" y2="173" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><line x1="708" y1="184" x2="702" y2="166" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><line x1="722" y1="177" x2="716" y2="159" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><line x1="736" y1="170" x2="730" y2="