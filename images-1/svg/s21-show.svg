<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 112" role="img" aria-label="Покажите одну картинку, прочитайте промт и назовите совпавшую деталь"><title>Покажите одну картинку, прочитайте промт и назовите совпавшую деталь</title><rect x="15" y="10" width="300" height="92" rx="16" fill="#EFEFF2" stroke="none" stroke-width="3"/><circle cx="49" cy="56" r="18" fill="#17171C"/><text x="49" y="64" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="79" y="50" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17171C" text-anchor="start">Выберите</text><text x="79" y="80" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#5F5F6B" text-anchor="start">одну картинку</text><line x1="319" y1="56" x2="340.0" y2="56.0" stroke="#8F8F98" stroke-width="4" stroke-linecap="round"/><path d="M346 56 L332.0 49.0 L332.0 63.0 Z" fill="#8F8F98"/><rect x="350" y="10" width="300" height="92" rx="16" fill="#EFEFF2" stroke="none" stroke-width="3"/><circle cx="384" cy="56" r="18" fill="#17171C"/><text x="384" y="64" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="414" y="50" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17171C" text-anchor="start">Прочитайте</text><text x="414" y="80" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#5F5F6B" text-anchor="start">свой промт</text><line x1="654" y1="56" x2="675.0" y2="56.0" stroke="#8F8F98" stroke-width="4" stroke-linecap="round"/><path d="M681 56 L667.0 49.0 L667.0 63.0 Z" fill="#8F8F98"/><rect x="685" y="10" width="300" height="92" rx="16" fill="#EFEFF2" stroke="none" stroke-width="3"/><circle cx="719" cy="56" r="18" fill="#17171C"/