<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 285" role="img" aria-label="В коротком промте нет ответа на вопросы: какая игра, кто герой, что ему нужно сделать и какой длины ответ"><title>В коротком промте нет ответа на вопросы: какая игра, кто герой, что ему нужно сделать и какой длины ответ</title><rect x="15" y="70" width="380" height="120" rx="18" fill="#F0EEFE" stroke="#6F61E8" stroke-width="3"/><text x="205" y="142" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#17171C" text-anchor="middle">«Придумай игру.»</text><line x1="405" y1="130" x2="470" y2="130" stroke="#8F8F98" stroke-width="4" stroke-linecap="round"/><path d="M470 130 L456.8 137.2 L456.8 122.8 Z" fill="#8F8F98"/><text x="485" y="30" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#5F5F6B" text-anchor="start">В промте нет ответа на эти вопросы:</text><rect x="485" y="48" width="500" height="46" rx="14" fill="#FFFFFF" stroke="#8F8F98" stroke-width="3" stroke-dasharray="8 7"/><text x="508" y="80" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#17171C" text-anchor="start">Какая это игра?</text><rect x="485" y="104" width="500" height="46" rx="14" fill="#FFFFFF" stroke="#8F8F98" stroke-width="3" stroke-dasharray="8 7"/><text x="508" y="136" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#17171C" text-anchor="start">Кто герой?</text><rect x="485" y="160" width="500" height="46" rx="14" fill="#FFFFFF" stroke="#8F8F98" stroke-width="3" stroke-dasharray="8 7"/><text x="508" y="192" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#17171C" text-anchor="start">Что ему нужно сделать?</text><rect x="485" y="216" width="500" height="46" rx="14" fill="#FFFFFF" stroke="#8F8F98" stroke-width="3" stroke-dasharray="8 7"/><text x="508" y="248" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#17171C" text-anchor="start">Какой длины ответ?</text></svg>