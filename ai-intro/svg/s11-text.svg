<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" role="img" aria-label="Текстовая нейросеть выбирает продолжение фразы и может написать складно, но неверно"><title>Текстовая нейросеть выбирает продолжение фразы и может написать складно, но неверно</title><rect x="15" y="15" width="540" height="280" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><text x="35" y="56" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#17171C" text-anchor="start">Выбирает, что подойдёт дальше</text><svg x="25" y="70" width="515" height="210" viewBox="0 0 560 172" role="img" aria-label="Схема: начало фразы и три возможных продолжения, чаще подходит слово дерево, реже облако"><text x="4" y="94" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#17171C">Кот залез на…</text><text x="4" y="124" font-family="Inter, sans-serif" font-size="17" font-weight="500" fill="#62616C">Схема упрощена</text><path d="M186 86H210M202 78L211 86L202 94" fill="none" stroke="#6F61E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="226" y="20" width="270" height="40" rx="10" fill="#A79EF9" stroke="#17171C" stroke-width="2"/><text x="240" y="47" font-family="Inter, sans-serif" font-size="21" font-weight="700" fill="#17171C">дерево</text><rect x="226" y="76" width="180" height="40" rx="10" fill="#C9C3FB" stroke="#17171C" stroke-width="2"/><text x="240" y="103" font-family="Inter, sans-serif" font-size="21" font-weight="700" fill="#17171C">крышу</text><rect x="226" y="132" width="72" height="40" rx="10" fill="#E3E3EA" stroke="#17171C" stroke-width="2"/><text x="308" y="159" font-family="Inter, sans-serif" font-size="21" font-weight="700" fill="#17171C">облако</text></svg><rect x="570" y="15" width="415" height="280" rx="18" fill="#F0EEFE" stroke="none" stroke-width="3"/><text x="590" y="56" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#17171C" text-anchor="start">Складно, но неверно</text><text x="590" y="100" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17171C" text-anchor="start">«У обычной кошки шесть лап».</text><text x="590" y="146" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#17171C" text-anchor="start">Уверенный тон не доказывает,</text><text x="590" y="177" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#17171C" text-anchor="start">что это правда.</text><rect x="15" y="308" width="970" height="60" rx="14" fill="#E7FDF2" stroke="#0FBF6E" stroke-width="3"/><text x="40" y="347" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#17171C" text-anchor="start">До разговора её обучали на текстах. В разговоре заново не учат</text></svg>