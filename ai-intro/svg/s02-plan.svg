<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" role="img" aria-label="План занятия: шесть частей урока с минутами"><title>План занятия: шесть частей урока с минутами</title><rect x="15" y="15" width="970" height="74" rx="16" fill="#F5F5F9" stroke="none" stroke-width="3"/><rect x="35" y="33" width="110" height="38" rx="19" fill="#3DF79D" stroke="none" stroke-width="3"/><text x="90" y="60" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">0–5</text><text x="170" y="46" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17171C" text-anchor="start">Начало</text><text x="170" y="75" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#5F5F6B" text-anchor="start">Приветствие, план и цель урока.</text><rect x="15" y="99" width="970" height="74" rx="16" fill="#F5F5F9" stroke="none" stroke-width="3"/><rect x="35" y="117" width="110" height="38" rx="19" fill="#3DF79D" stroke="none" stroke-width="3"/><text x="90" y="144" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">5–10</text><text x="170" y="130" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17171C" text-anchor="start">Знакомство с темой</text><text x="170" y="159" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#5F5F6B" text-anchor="start">Что умеют нейросети, отличие от обычной программы.</text><rect x="15" y="183" width="970" height="74" rx="16" fill="#F5F5F9" stroke="none" stroke-width="3"/><rect x="35" y="201" width="110" height="38" rx="19" fill="#3DF79D" stroke="none" stroke-width="3"/><text x="90" y="228" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">10–30</text><text x="170" y="214" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17171C" text-anchor="start">Новая тема</text><text x="170" y="243" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#5F5F6B" text-anchor="start">Обучение на примерах, причины ошибок, личные сведения.</text><rect x="15" y="267" width="970" height="74" rx="16" fill="#F5F5F9" stroke="none" stroke-width="3"/><rect x="35" y="285" width="110" height="38" rx="19" fill="#3DF79D" stroke="none" stroke-width="3"/><text x="90" y="312" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">30–35</text><text x="170" y="298" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17171C" text-anchor="start">Пауза и проверка</text><text x="170" y="327" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#5F5F6B" text-anchor="start">Разминка и порядок шагов обучения.</text><rect x="15" y="351" width="970" height="74" rx="16" fill="#F5F5F9" stroke="none" stroke-width="3"/><rect x="35" y="369" width="110" height="38" rx="19" fill="#3DF79D" stroke="none" stroke-width="3"/><text x="90" y="396" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">35–55</text><text x="170" y="382" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17171C" text-anchor="start">Практика</text><text x="170" y="411" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#5F5F6B" text-anchor="start">Запрос к Алисе AI, проверка ответа, уточнение.</text><rect x="15" y="435" width="970" height="74" rx="16" fill="#F5F5F9" stroke="none" stroke-width="3"/><rect x="35" y="453" width="110" height="38" rx="19" fill="#3DF79D" stroke="none" stroke-width="3"/><text x="90" y="480" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17171C" text-anchor="middle">55–60</text><text x="170" y="466" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17171C" text-anchor="start">Итоги</text><text x="170" y="495" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#5F5F6B" text-anchor="start">Вопросы, достигнутые цели, домашнее задание.</text></svg>