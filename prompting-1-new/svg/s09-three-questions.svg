<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 265" role="img" aria-label="Три вопроса промта: что сделать, про что, какой нужен ответ"><title>Три вопроса промта: что сделать, про что, какой нужен ответ</title><rect x="15" y="20" width="310" height="225" rx="18" fill="#F0EEFE" stroke="#6F61E8" stroke-width="3"/><circle cx="53" cy="60" r="19" fill="#6F61E8"/><text x="53" y="68" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="85" y="69" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17171C" text-anchor="start">Что сделать?</text><text x="41" y="120.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Придумать сказку</text><text x="41" y="152.5" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Объяснить</text><text x="41" y="185.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Составить список</text><rect x="345" y="20" width="310" height="225" rx="18" fill="#E7FDF2" stroke="#0FBF6E" stroke-width="3"/><circle cx="383" cy="60" r="19" fill="#0FBF6E"/><text x="383" y="68" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="415" y="69" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17171C" text-anchor="start">Про что?</text><text x="371" y="120.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Про кого история</text><text x="371" y="152.5" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Что случилось</text><text x="371" y="185.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Где это было</text><rect x="675" y="20" width="310" height="225" rx="18" fill="#FFECEC" stroke="#E04848" stroke-width="3"/><circle cx="713" cy="60" r="19" fill="#E04848"/><text x="713" y="68" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="743" y="68" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17171C" text-anchor="start">Какой нужен ответ?</text><text x="701" y="120.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Сколько пунктов</text><text x="701" y="152.5" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Какой длины</text><text x="701" y="185.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Список или рассказ</text></svg>