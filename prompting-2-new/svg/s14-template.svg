<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 288" role="img" aria-label="Образец промта: роль, цель, контекст и формат"><title>Образец промта: роль, цель, контекст и формат</title><rect x="15" y="6" width="1090" height="56" rx="14" fill="#EFEFF2" stroke="#17171C" stroke-width="2"/><rect x="26" y="15" width="50" height="38" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="51" cy="34.0" r="18" fill="#17171C"/><circle cx="51" cy="29.0" r="5.5" fill="#FFFFFF"/><path d="M42 45.0 C42 35.0,60 35.0,60 45.0 Z" fill="#FFFFFF"/><text x="91" y="44" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17171C" text-anchor="start">Выступи в роли ведущего викторины.</text><rect x="15" y="68" width="1090" height="90" rx="14" fill="#F0EEFE" stroke="#6F61E8" stroke-width="2"/><rect x="26" y="77" width="50" height="72" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="51" cy="113.0" r="17" fill="#6F61E8"/><text x="51" y="121.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="91" y="106" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17171C" text-anchor="start">Придумай 3 вопроса про планеты Солнечной системы: какая</text><text x="91" y="140" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17171C" text-anchor="start">планета по счёту от Солнца, какая самая большая или самая маленькая.</text><rect x="15" y="164" width="1090" height="56" rx="14" fill="#E7FDF2" stroke="#0FBF6E" stroke-width="2"/><rect x="26" y="173" width="50" height="38" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="51" cy="192.0" r="17" fill="#0FBF6E"/><text x="51" y="200.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="194" y="174" width="82" height="37" rx="7" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="91" y="202" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17171C" text-anchor="start">Это для <tspan fill="#126248" font-weight="800">[кого]</tspan>.</text><rect x="15" y="226" width="1090" height="56" rx="14" fill="#FFECEC" stroke="#E04848" stroke-width="2"/><rect x="26" y="235" width="50" height="38" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="51" cy="254.0" r="17" fill="#E04848"/><text x="51" y="262.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="91" y="264" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17171C" text-anchor="start">У каждого вопроса 3 варианта ответа. Напиши все вопросы сразу.</text></svg>