<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-label="Три подсказки к рассказу: название и герой, правка, промт для названия"><title>Три подсказки к рассказу: название и герой, правка, промт для названия</title><path d="M45 170 L45 205 L90 170 Z" fill="#EFEFF2" stroke="#17171C" stroke-width="3" stroke-linejoin="round"/><rect x="15" y="15" width="310" height="160" rx="18" fill="#EFEFF2" stroke="#17171C" stroke-width="3"/><text x="41" y="61" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17171C" text-anchor="start">Название</text><text x="41" y="108.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Как называется</text><text x="41" y="140.5" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">игра и кто герой</text><path d="M375 170 L375 205 L420 170 Z" fill="#EFEFF2" stroke="#17171C" stroke-width="3" stroke-linejoin="round"/><rect x="345" y="15" width="310" height="160" rx="18" fill="#EFEFF2" stroke="#17171C" stroke-width="3"/><text x="371" y="61" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17171C" text-anchor="start">Правка</text><text x="371" y="108.0" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">Что вы изменили</text><text x="371" y="140.5" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17171C" text-anchor="start">в сценарии</text><path d="M705 170 L705 205 L750 170 Z" fill="#EFEFF2" stroke="#17171C" stroke-width="3" stroke-linejoin="round"/><rect x="675" y="15" width="310" height="160" rx="18" fill="#EFEFF2" stroke="#17171C" stroke-width="3"/><text x="701" y="61" font-family="Inter Tight, Inter, Arial, Helvetica, sans-s