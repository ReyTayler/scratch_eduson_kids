<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 275" role="img" aria-label="Три вопроса для проверки ответа"><title>Три вопроса для проверки ответа</title><rect x="15" y="15" width="970" height="72" rx="16" fill="#F0EEFE" stroke="#6F61E8" stroke-width="3"/><rect x="38" y="32" width="38" height="38" rx="9" fill="#FFFFFF" stroke="#6F61E8" stroke-width="4"/><text x="96" y="61" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#17171C" text-anchor="start">Это сценарий игры?</text><rect x="15" y="101" width="970" height="72" rx="16" fill="#E7FDF2" stroke="#0FBF6E" stroke-width="3"/><rect x="38" y="118" width="38" height="38" rx="9" fill="#FFFFFF" stroke="#0FBF6E" stroke-width="4"/><text x="96" y="147" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#17171C" text-anchor="start">Герой и его задача те, что вы написали?</text><rect x="15" y="187" width="970" height="72" rx="16" fill="#FFECEC" stroke="#E04848" stroke-width="3"/><rect x="38" y="204" width="38" height="38" rx="9" fill="#FFFFFF" stroke="#E04848" stroke-width="4"/><text x="96" y="233" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#17171C" text-anchor="start">Ровно 4 пункта: начало, что мешает, как справляется, конец?</text></svg>