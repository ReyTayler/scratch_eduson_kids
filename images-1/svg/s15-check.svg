<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 208" role="img" aria-label="Проверка картинки по промту: предмет, фон, стиль"><title>Проверка картинки по промту: предмет, фон, стиль</title><rect x="15" y="8" width="970" height="56" rx="14" fill="#F0EEFE" stroke="none" stroke-width="3"/><text x="93" y="43" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#17171C" text-anchor="middle">Предмет</text><text x="176" y="45" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#17171C" text-anchor="start">Тот персонаж? Цвет, детали, количество?</text><rect x="15" y="74" width="970" height="56" rx="14" fill="#E7FDF2" stroke="none" stroke-width="3"/><text x="93" y="109" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#17171C" text-anchor="middle">Фон</text><text x="176" y="111" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#17171C" text-anchor="start">То место, что в промте?</text><rect x="15" y="140" width="970" height="56" rx="14" fill="#FFF1E0" stroke="none" stroke-width="3"/><text x="93" y="175" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#17171C" text-anchor="middle">Стиль</text><text x="176" y="177" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#17171C" text-anchor="start">Тот стиль, что в промте?</text></svg>