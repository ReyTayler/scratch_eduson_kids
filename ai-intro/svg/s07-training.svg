ениях"><path d="M14 20H106" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><circle cx="78" cy="20" r="9" fill="#8C7FF6" stroke="#17171C" stroke-width="3"/><path d="M14 46H106" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><circle cx="36" cy="46" r="9" fill="#8C7FF6" stroke="#17171C" stroke-width="3"/><path d="M14 72H106" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><circle cx="62" cy="72" r="9" fill="#8C7FF6" stroke="#17171C" stroke-width="3"/></svg><text x="768" y="188" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#17171C" text-anchor="start">4 · Настройка</text><text x="768" y="226" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#17171C" text-anchor="start">Числа внутри</text><text x="768" y="256" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#17171C" text-anchor="start">меняют.</text></svg>