<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-label="Что умеют нейросети: переводят, слышат, пишут, рисуют"><title>Что умеют нейросети: переводят, слышат, пишут, рисуют</title><rect x="15" y="15" width="235" height="280" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><svg x="35" y="35" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Два облачка с буквами разных языков"><circle cx="48" cy="48" r="48" fill="#F0EEFE"/><g stroke="#17171C" stroke-width="3" stroke-linejoin="round"><path d="M18 24H52V50H32L24 58V50H18Z" fill="#fff"/><path d="M44 42H78V68H72V76L64 68H44Z" fill="#8C7FF6"/></g><text x="35" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#17171C">A</text><text x="61" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#fff">Я</text></svg><text x="35" y="170" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#17171C" text-anchor="start">Переводят</text><text x="35" y="208" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#17171C" text-anchor="start">С одного языка на</text><text x="35" y="238" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#17171C" text-anchor="start">другой.</text><rect x="260" y="15" width="235" height="280" rx="18" fill="#F5F5F9" stroke="none" stroke-width="3"/><svg x="280" y="35" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Звуковая волна и страница с текстом"><circle cx="48" cy="48" r="48" fill="#F0EEFE"/><path d="M26 40V56M34 30V66M42 40V56M18 46V50" stroke="#6F61E8" stroke-width="5" stroke-linecap="round"/><rect x="52" y="28" width="28" height="40" rx="4" fill="#fff" stroke="#17171C" stroke-width="3"/><path d="M58 38H74M58 48H74M58 58H68" stroke="#17171C" stroke-width="3" stroke-linecap="round"/></svg><tex